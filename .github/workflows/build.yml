name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb,appimage
          - os: macos-15
            bundles: dmg
          - os: macos-15-intel
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libfuse2t64
      - name: Install frontend dependencies
        run: |
          if test -f package-lock.json; then npm ci; else npm install; fi
      - run: npm run build
      - run: npm run test:ui
      - run: npm run test:protocol
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run runtime:build
      - run: python3 scripts/collect-licenses.py
      - name: Package desktop app
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
      - name: Verify macOS bundle
        if: runner.os == 'macOS'
        run: |
          app="src-tauri/target/release/bundle/macos/Anywhere Plamo.app"
          runtime="$app/Contents/Resources/resources/runtime/llama-server"
          codesign --verify --deep --strict "$app"
          codesign --verify --strict "$runtime"
          "$runtime" --version
      - uses: actions/upload-artifact@v4
        with:
          name: anywhere-plamo-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: anywhere-plamo-*
          path: installers
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --draft --title "Anywhere Plamo $RELEASE_TAG" --generate-notes
          find installers -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' \) -exec gh release upload "$RELEASE_TAG" --clobber '{}' +
          gh release edit "$RELEASE_TAG" --draft=false
