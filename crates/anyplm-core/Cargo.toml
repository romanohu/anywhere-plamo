[package]
name = "anyplm-core"
version = "0.2.8"
description = "PLaMo translation core shared by the Anywhere Plamo app and the plm CLI"
edition = "2021"
rust-version = "1.90"
license = "MIT"
workspace = "../../src-tauri"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["fs", "io-util", "process", "sync", "time", "macros"] }
tokio-util = "0.7"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
