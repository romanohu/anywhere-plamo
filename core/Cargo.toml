[package]
name = "plamo-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
